<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nathan — 29 on the 29th</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }


    body {

      background: #f4f1e9;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: #241f1b;
    }


    /* ========================================
       MAIN STAGE
    ======================================== */

    .stage {

      position: relative;

      width:
        min(
          92vw,
          56.25vh,
          620px
        );

      aspect-ratio: 9 / 16;

      touch-action: none;

      user-select: none;
    }


    /* ========================================
       NORMAL INVITATION SHEETS
    ======================================== */

    .card {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      object-fit: cover;

      border-radius: 2px;


      box-shadow:
        0 10px 25px rgba(40, 30, 20, 0.10),
        0 2px 6px rgba(40, 30, 20, 0.08);


      will-change:
        transform,
        opacity;


      transition:
        transform 520ms cubic-bezier(.22,.61,.36,1),
        opacity 350ms ease;


      cursor: grab;
    }


    .card:active {
      cursor: grabbing;
    }


    .card.is-moving {
      transition: none;
    }



    /* ========================================
       LINK CARD CONTAINER

       This container is the thing that
       gets shuffled.

       The image and invisible links are
       positioned relative to THIS container.
    ======================================== */

    .links-sheet {

      position: absolute;

      left: 50%;

      top: 50%;

      width:
        min(
          78%,
          500px
        );

      aspect-ratio: 1050 / 600;


      transform:
        translate(-50%, -50%);


      will-change:
        transform,
        opacity;


      transition:
        transform 520ms cubic-bezier(.22,.61,.36,1),
        opacity 350ms ease;


      cursor: grab;

      z-index: 1;
    }


    .links-sheet:active {
      cursor: grabbing;
    }


    .links-sheet.is-moving {
      transition: none;
    }



    /* ========================================
       LINK CARD IMAGE
    ======================================== */

    .links-sheet img {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;


      border-radius: 1px;


      box-shadow:
        0 14px 28px rgba(40, 30, 20, 0.14),
        0 4px 9px rgba(40, 30, 20, 0.10),
        0 1px 2px rgba(40, 30, 20, 0.10);

    }



    /* ========================================
       INVISIBLE CLICKABLE AREAS

       These are now positioned RELATIVE TO
       THE LINK CARD itself.

       Therefore they stay exactly over
       the correct words on every screen size.
    ======================================== */

    .link-area {

      position: absolute;

      display: block;

      z-index: 100;


      text-decoration: none;

      background: transparent;


      /*
        This prevents tapping a link from
        being interpreted as a card swipe.
      */

      touch-action: manipulation;
    }



    /* ----------------------------------------
       RSVP HERE
    ---------------------------------------- */

    .rsvp-link {

      left: 28%;

      top: 37%;

      width: 44%;

      height: 18%;
    }



    /* ----------------------------------------
       GIFT REGISTRY
    ---------------------------------------- */

    .registry-link {

      left: 27%;

      top: 67%;

      width: 46%;

      height: 20%;
    }



    /* ========================================
       REDUCED MOTION
    ======================================== */

    @media (prefers-reduced-motion: reduce) {

      .card,
      .links-sheet {

        transition: none !important;
      }

    }

  </style>

</head>


<body>


  <main
    class="stage"
    id="stage"
  >


    <!-- ====================================
         COMPLETE PHYSICAL STACK

         Bottom → Top:

         LINK CARD
         DETAILS
         BACK
         FRONT
    ==================================== -->


    <!-- ====================================
         LINK CARD
    ==================================== -->

    <div
      class="links-sheet"
      id="linksSheet"
    >

      <img
        src="links.png"
        alt="RSVP and gift registry"
        draggable="false"
      >


      <!-- ==================================
           INVISIBLE RSVP LINK
      ================================== -->

      <a
        class="link-area rsvp-link"
        href="https://forms.gle/WnSz88XWHCNcfrE16"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Respond to the invitation"
      ></a>


      <!-- ==================================
           INVISIBLE GIFT REGISTRY LINK
      ================================== -->

      <a
        class="link-area registry-link"
        href="https://www.myregistry.com/giftlist/nathans29th"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open gift registry"
      ></a>

    </div>



    <!-- ====================================
         PAGE 3
    ==================================== -->

    <img
      class="card"
      src="details.png"
      alt=""
      draggable="false"
    >



    <!-- ====================================
         PAGE 2
    ==================================== -->

    <img
      class="card"
      src="back.png"
      alt=""
      draggable="false"
    >



    <!-- ====================================
         PAGE 1
    ==================================== -->

    <img
      class="card"
      src="front.png"
      alt=""
      draggable="false"
    >


  </main>



  <script>

    /* ========================================
       SETUP
    ======================================== */

    const stage =
      document.getElementById("stage");


    const linksSheet =
      document.getElementById("linksSheet");


    const normalCards =
      Array.from(
        document.querySelectorAll(".card")
      );


    /*
      Bottom → Top

      links
      details
      back
      front
    */

    let stack = [
      linksSheet,
      normalCards[0],
      normalCards[1],
      normalCards[2]
    ];


    let dragging = false;

    let activeCard = null;


    let startX = 0;

    let startY = 0;


    let currentX = 0;

    let currentY = 0;


    let animationRunning = false;



    /* ========================================
       RENDER STACK
    ======================================== */

    function renderStack() {

      stack.forEach(
        (card, index) => {

          card.classList.remove(
            "is-moving"
          );


          const depth =
            index;


          card.style.zIndex =
            depth + 1;


          /*
            The link card is already centered
            using translate(-50%, -50%).
          */

          if (
            card === linksSheet
          ) {

            card.style.transform =
              `translate(-50%, -50%)
               translateY(${(3 - depth) * 4}px)
               scale(${1 - (3 - depth) * 0.008})`;

          } else {

            card.style.transform =
              `translateY(${(3 - depth) * 4}px)
               scale(${1 - (3 - depth) * 0.008})`;

          }


          card.style.opacity = "1";


          /*
            Only the top sheet should receive
            swipe interaction.

            The link card's own <a> elements
            remain clickable when it is on top.
          */

          card.style.pointerEvents =
            "none";

        }
      );


      const top =
        stack[stack.length - 1];


      if (top) {

        top.style.pointerEvents =
          "auto";

      }

    }



    /* ========================================
       POINTER DOWN
    ======================================== */

    function pointerDown(event) {

      if (animationRunning) {
        return;
      }


      /*
        If the user touched either invisible
        link, do NOT start a card shuffle.
      */

      if (
        event.target.closest(
          ".link-area"
        )
      ) {

        return;

      }


      const top =
        stack[stack.length - 1];


      if (
        event.currentTarget !== top
      ) {

        return;

      }


      dragging = true;

      activeCard = top;


      startX =
        event.clientX;


      startY =
        event.clientY;


      currentX = 0;

      currentY = 0;


      activeCard.classList.add(
        "is-moving"
      );


      activeCard.setPointerCapture(
        event.pointerId
      );

    }



    /* ========================================
       POINTER MOVE
    ======================================== */

    function pointerMove(event) {

      if (
        !dragging ||
        !activeCard
      ) {

        return;

      }


      currentX =
        event.clientX - startX;


      currentY =
        event.clientY - startY;


      if (
        activeCard === linksSheet
      ) {

        activeCard.style.transform =
          `translate(-50%, -50%)
           translate(
             ${currentX}px,
             ${currentY * 0.35}px
           )
           rotate(
             ${currentX * 0.025}deg
           )`;

      } else {

        activeCard.style.transform =
          `translate(
            ${currentX}px,
            ${currentY * 0.35}px
          )
          rotate(
            ${currentX * 0.025}deg
          )`;

      }

    }



    /* ========================================
       POINTER UP
    ======================================== */

    function pointerUp(event) {

      if (
        !dragging ||
        !activeCard
      ) {

        return;

      }


      dragging = false;


      try {

        activeCard.releasePointerCapture(
          event.pointerId
        );

      } catch (e) {}


      const distance =
        Math.sqrt(
          currentX * currentX +
          currentY * currentY
        );


      const threshold =
        Math.max(
          55,
          stage.clientWidth * 0.13
        );


      if (
        distance >= threshold
      ) {

        shuffleTopCard();

      } else {

        resetTopCard();

      }


      activeCard = null;

    }



    /* ========================================
       RESET CARD
    ======================================== */

    function resetTopCard() {

      if (!activeCard) {
        return;
      }


      activeCard.classList.remove(
        "is-moving"
      );


      if (
        activeCard === linksSheet
      ) {

        activeCard.style.transform =
          "translate(-50%, -50%)";

      } else {

        activeCard.style.transform =
          "translateY(0) scale(1)";

      }


      setTimeout(
        () => {

          renderStack();

        },
        30
      );

    }



    /* ========================================
       SHUFFLE TOP CARD
    ======================================== */

    function shuffleTopCard() {

      if (animationRunning) {
        return;
      }


      const top =
        stack[stack.length - 1];


      if (!top) {
        return;
      }


      animationRunning = true;


      const direction =
        currentX >= 0
          ? 1
          : -1;


      top.classList.remove(
        "is-moving"
      );


      top.style.zIndex = 30;


      /*
        Slide the top sheet away.
      */

      if (
        top === linksSheet
      ) {

        top.style.transform =
          `translate(-50%, -50%)
           translate(
             ${direction * stage.clientWidth * 1.15}px,
             ${currentY * 0.35}px
           )
           rotate(
             ${direction * 7}deg
           )`;

      } else {

        top.style.transform =
          `translate(
            ${direction * stage.clientWidth * 1.15}px,
            ${currentY * 0.35}px
          )
          rotate(
            ${direction * 7}deg
          )`;

      }


      top.style.opacity = "0";


      /* ------------------------------------
         MOVE TOP TO BOTTOM
      ------------------------------------ */

      setTimeout(
        () => {

          stack.pop();

          stack.unshift(top);


          top.style.opacity = "1";


          animationRunning = false;


          renderStack();

        },
        520
      );

    }



    /* ========================================
       NORMAL INVITATION EVENTS
    ======================================== */

    normalCards.forEach(
      (card) => {

        card.addEventListener(
          "pointerdown",
          pointerDown
        );


        card.addEventListener(
          "pointermove",
          pointerMove
        );


        card.addEventListener(
          "pointerup",
          pointerUp
        );


        card.addEventListener(
          "pointercancel",
          pointerUp
        );

      }
    );



    /* ========================================
       LINK CARD EVENTS
    ======================================== */

    linksSheet.addEventListener(
      "pointerdown",
      pointerDown
    );


    linksSheet.addEventListener(
      "pointermove",
      pointerMove
    );


    linksSheet.addEventListener(
      "pointerup",
      pointerUp
    );


    linksSheet.addEventListener(
      "pointercancel",
      pointerUp
    );



    /* ========================================
       INITIAL STATE
    ======================================== */

    renderStack();

  </script>


</body>

</html>
