<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nathan — 29 on the 29th</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }


    body {

      background: #f4f1e9;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: #241f1b;
    }


    /* ========================================
       MAIN STAGE
    ======================================== */

    .stage {

      position: relative;

      width:
        min(
          92vw,
          56.25vh,
          620px
        );

      aspect-ratio: 9 / 16;

      touch-action: none;

      user-select: none;
    }


    /* ========================================
       STANDARD INVITATION SHEETS
    ======================================== */

    .card {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      object-fit: cover;

      border-radius: 2px;


      box-shadow:
        0 10px 25px rgba(40, 30, 20, 0.10),
        0 2px 6px rgba(40, 30, 20, 0.08);


      will-change:
        transform,
        opacity;


      transition:
        transform 520ms cubic-bezier(.22,.61,.36,1),
        opacity 350ms ease;


      cursor: grab;
    }


    .card:active {
      cursor: grabbing;
    }


    .card.is-moving {
      transition: none;
    }


    /* ========================================
       SMALL LINK CARD
    ======================================== */

    .links-sheet {

      position: absolute;

      left: 50%;

      top: 50%;


      /*
        Smaller than the main invitation sheets,
        like a physical enclosure card.
      */

      width:
        min(
          78%,
          500px
        );

      height: auto;

      aspect-ratio: 1050 / 600;


      object-fit: cover;

      border-radius: 1px;


      box-shadow:
        0 14px 28px rgba(40, 30, 20, 0.14),
        0 4px 9px rgba(40, 30, 20, 0.10),
        0 1px 2px rgba(40, 30, 20, 0.10);


      will-change:
        transform,
        opacity;


      transition:
        transform 520ms cubic-bezier(.22,.61,.36,1),
        opacity 350ms ease;


      cursor: grab;

      z-index: 1;
    }


    .links-sheet:active {
      cursor: grabbing;
    }


    .links-sheet.is-moving {
      transition: none;
    }


    /* ========================================
       INVISIBLE CLICKABLE AREAS
    ======================================== */

    .link-area {

      position: absolute;

      display: block;

      z-index: 100;

      text-decoration: none;

      background: transparent;

      /*
        Prevent clicking a link from
        accidentally starting a shuffle.
      */

      touch-action: manipulation;
    }


    /*
      RSVP Here

      The card artwork is 1050 × 600.

      This area is deliberately a little
      larger than the words themselves so
      it is easy to tap on a phone.
    */

    .rsvp-link {

      left: 29%;

      top: 39%;

      width: 42%;

      height: 14%;
    }


    /*
      Gift Registry
    */

    .registry-link {

      left: 29%;

      top: 69%;

      width: 42%;

      height: 15%;
    }


    /* ========================================
       REDUCED MOTION
    ======================================== */

    @media (prefers-reduced-motion: reduce) {

      .card,
      .links-sheet {

        transition: none !important;
      }

    }

  </style>

</head>


<body>


  <main
    class="stage"
    id="stage"
  >


    <!-- ====================================
         THE FOUR PIECES OF STATIONERY

         IMPORTANT:
         Bottom → Top:

         links.png
         details.png
         back.png
         front.png

         Therefore FRONT is initially on top.
    ==================================== -->


    <!-- LINK CARD — BOTTOM -->

    <img
      class="links-sheet"
      id="linksSheet"
      src="links.png"
      alt="RSVP and gift registry"
      draggable="false"
    >


    <!-- PAGE 3 -->

    <img
      class="card"
      src="details.png"
      alt=""
      draggable="false"
    >


    <!-- PAGE 2 -->

    <img
      class="card"
      src="back.png"
      alt=""
      draggable="false"
    >


    <!-- PAGE 1 -->

    <img
      class="card"
      src="front.png"
      alt=""
      draggable="false"
    >


    <!-- ====================================
         INVISIBLE LINKS ON THE LINK CARD

         Only the actual words are clickable.
    ==================================== -->


    <a
      class="link-area rsvp-link"
      href="https://forms.gle/WnSz88XWHCNcfrE16"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Respond to the invitation"
    ></a>


    <a
      class="link-area registry-link"
      href="https://www.myregistry.com/giftlist/nathans29th"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open gift registry"
    ></a>


  </main>



  <script>

    /* ========================================
       SETUP
    ======================================== */

    const stage =
      document.getElementById("stage");


    const linksSheet =
      document.getElementById("linksSheet");


    const normalCards =
      Array.from(
        document.querySelectorAll(".card")
      );


    /*
      The complete physical stack.

      Bottom → Top:

      links
      details
      back
      front
    */

    let stack = [
      linksSheet,
      normalCards[0],
      normalCards[1],
      normalCards[2]
    ];


    let dragging = false;

    let activeCard = null;


    let startX = 0;

    let startY = 0;


    let currentX = 0;

    let currentY = 0;


    let animationRunning = false;



    /* ========================================
       RENDER STACK
    ======================================== */

    function renderStack() {

      stack.forEach(
        (card, index) => {

          card.classList.remove(
            "is-moving"
          );


          const depth =
            index;


          /*
            The three large invitation sheets
            have their normal full-size layout.

            The small link card keeps its own
            centered landscape size.
          */

          if (
            card === linksSheet
          ) {

            card.style.zIndex =
              depth + 1;


            card.style.transform =
              `translate(-50%, -50%)
               translateY(${(3 - depth) * 4}px)
               scale(${1 - (3 - depth) * 0.008})`;


          } else {

            card.style.zIndex =
              depth + 1;


            card.style.transform =
              `translateY(${(3 - depth) * 4}px)
               scale(${1 - (3 - depth) * 0.008})`;

          }


          card.style.opacity = "1";


          /*
            Only the top sheet receives
            pointer interaction.

            The invisible links remain clickable
            when the link card is on top.
          */

          card.style.pointerEvents =
            "none";
        }
      );


      const top =
        stack[stack.length - 1];


      if (top) {

        top.style.pointerEvents =
          "auto";

      }

    }



    /* ========================================
       POINTER DOWN
    ======================================== */

    function pointerDown(event) {

      if (animationRunning) {
        return;
      }


      /*
        If the guest tapped one of the
        invisible link areas, don't shuffle.
      */

      if (
        event.target.closest(
          ".link-area"
        )
      ) {

        return;

      }


      const top =
        stack[stack.length - 1];


      if (
        event.currentTarget !== top
      ) {

        return;

      }


      dragging = true;

      activeCard = top;


      startX =
        event.clientX;


      startY =
        event.clientY;


      currentX = 0;

      currentY = 0;


      activeCard.classList.add(
        "is-moving"
      );


      activeCard.setPointerCapture(
        event.pointerId
      );

    }



    /* ========================================
       POINTER MOVE
    ======================================== */

    function pointerMove(event) {

      if (
        !dragging ||
        !activeCard
      ) {

        return;

      }


      currentX =
        event.clientX - startX;


      currentY =
        event.clientY - startY;


      if (
        activeCard === linksSheet
      ) {

        activeCard.style.transform =
          `translate(-50%, -50%)
           translate(${currentX}px, ${currentY * 0.35}px)
           rotate(${currentX * 0.025}deg)`;

      } else {

        activeCard.style.transform =
          `translate(
            ${currentX}px,
            ${currentY * 0.35}px
          )
          rotate(
            ${currentX * 0.025}deg
          )`;

      }

    }



    /* ========================================
       POINTER UP
    ======================================== */

    function pointerUp(event) {

      if (
        !dragging ||
        !activeCard
      ) {

        return;

      }


      dragging = false;


      try {

        activeCard.releasePointerCapture(
          event.pointerId
        );

      } catch (e) {}


      const distance =
        Math.sqrt(
          currentX * currentX +
          currentY * currentY
        );


      const threshold =
        Math.max(
          55,
          stage.clientWidth * 0.13
        );


      if (
        distance >= threshold
      ) {

        shuffleTopCard();

      } else {

        resetTopCard();

      }


      activeCard = null;

    }



    /* ========================================
       RESET TOP CARD
    ======================================== */

    function resetTopCard() {

      if (!activeCard) {
        return;
      }


      activeCard.classList.remove(
        "is-moving"
      );


      if (
        activeCard === linksSheet
      ) {

        activeCard.style.transform =
          "translate(-50%, -50%)";

      } else {

        activeCard.style.transform =
          "translateY(0) scale(1)";

      }


      setTimeout(
        () => {

          renderStack();

        },
        30
      );

    }



    /* ========================================
       SHUFFLE TOP CARD
    ======================================== */

    function shuffleTopCard() {

      if (animationRunning) {
        return;
      }


      const top =
        stack[stack.length - 1];


      if (!top) {
        return;
      }


      animationRunning = true;


      const direction =
        currentX >= 0
          ? 1
          : -1;


      top.classList.remove(
        "is-moving"
      );


      top.style.zIndex = 30;


      /*
        Slide the sheet away.
      */

      if (
        top === linksSheet
      ) {

        top.style.transform =
          `translate(-50%, -50%)
           translate(
             ${direction * stage.clientWidth * 1.15}px,
             ${currentY * 0.35}px
           )
           rotate(
             ${direction * 7}deg
           )`;

      } else {

        top.style.transform =
          `translate(
            ${direction * stage.clientWidth * 1.15}px,
            ${currentY * 0.35}px
          )
          rotate(
            ${direction * 7}deg
          )`;

      }


      top.style.opacity = "0";



      /* ------------------------------------
         PUT THE SHEET UNDER THE STACK
      ------------------------------------ */

      setTimeout(
        () => {

          /*
            Take the top sheet...
          */

          stack.pop();


          /*
            ...and place it underneath
            everything else.
          */

          stack.unshift(top);


          top.style.opacity = "1";


          animationRunning = false;


          /*
            Render the newly revealed sheet.
          */

          renderStack();

        },
        520
      );

    }



    /* ========================================
       POINTER EVENTS
    ======================================== */

    normalCards.forEach(
      (card) => {

        card.addEventListener(
          "pointerdown",
          pointerDown
        );


        card.addEventListener(
          "pointermove",
          pointerMove
        );


        card.addEventListener(
          "pointerup",
          pointerUp
        );


        card.addEventListener(
          "pointercancel",
          pointerUp
        );

      }
    );


    /*
      The link card needs the same
      swipe behavior.
    */

    linksSheet.addEventListener(
      "pointerdown",
      pointerDown
    );


    linksSheet.addEventListener(
      "pointermove",
      pointerMove
    );


    linksSheet.addEventListener(
      "pointerup",
      pointerUp
    );


    linksSheet.addEventListener(
      "pointercancel",
      pointerUp
    );



    /* ========================================
       INITIAL STATE
    ======================================== */

    renderStack();

  </script>


</body>

</html>
